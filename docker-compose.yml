version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize the extension automatically
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/rag_platform
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data: